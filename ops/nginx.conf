# Nomad site: static SPA, /api and /ws proxied to the app container. TLS terminates here
# (certificates mounted at /etc/nginx/certs; see ops/compose.prod.yaml).

map $http_user_agent $is_bot {
  default 0;
  ~*(bot|crawler|spider|facebookexternalhit|telegrambot|whatsapp|slackbot|twitterbot|linkedinbot|vkshare|discordbot|skypeuripreview|yandex|googlebot) 1;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

upstream nomad_app {
  server app:3010;
  keepalive 32;
}

# Short cache for public API GETs (lists, profiles, live): 15 s, shared by all anonymous visitors.
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api:20m max_size=200m inactive=10m use_temp_path=off;

limit_req_zone $binary_remote_addr zone=api_write:10m rate=10r/s;

server {
  listen 80;
  server_name _;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name nomad.example.kz; # placeholder

  ssl_certificate /etc/nginx/certs/fullchain.pem;     # placeholder
  ssl_certificate_key /etc/nginx/certs/privkey.pem;   # placeholder
  ssl_protocols TLSv1.2 TLSv1.3;

  root /usr/share/nginx/html;
  client_max_body_size 10m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/yaml;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;

  # Crawlers get Open Graph HTML for tournament links; people get the SPA.
  location ~ ^/t/([^/]+)/?$ {
    if ($is_bot) { rewrite ^/t/([^/]+)/?$ /api/og/t/$1 last; }
    try_files /index.html =404;
  }

  location /ws {
    proxy_pass http://nomad_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass http://nomad_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Cache only anonymous GETs; anything with a session cookie goes straight to the app.
    proxy_cache api;
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 15s;
    proxy_cache_bypass $cookie_nomad_session $http_authorization;
    proxy_no_cache $cookie_nomad_session $http_authorization;
    proxy_cache_use_stale updating error timeout;
    proxy_cache_lock on;
    add_header X-Cache $upstream_cache_status always;

    limit_req zone=api_write burst=40 nodelay;
  }

  location ~ ^/api/(auth|admin|my|notifications|demo)/ {
    proxy_pass http://nomad_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
  }

  # Hashed build assets: cache for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
