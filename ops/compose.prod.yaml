name: nomad-prod

# Production stack. Secrets come from ops/.env.prod (not committed); certificates from ops/certs.
#   docker compose -f ops/compose.prod.yaml --env-file ops/.env.prod up -d --build
x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://nomad:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/nomad
  REDIS_URL: redis://redis:6379
  SITE_URL: ${SITE_URL:-https://nomad.example.kz}
  ADMIN_2FA_REQUIRED: "true"
  SMTP_URL: ${SMTP_URL:-}
  MAIL_FROM: ${MAIL_FROM:-Nomad <no-reply@nomad.kz>}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@nomad.kz}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}

# Rotated container logs (docker's default json-file grows without limit).
x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

services:
  app:
    build: { context: .., dockerfile: ops/Dockerfile.app }
    image: nomad-app
    environment: *app-env
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3010/api/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *logging

  worker:
    image: nomad-app
    command: ["npm", "run", "start", "-w", "@nomad/worker"]
    environment: *app-env
    depends_on:
      app: { condition: service_healthy }
    restart: unless-stopped
    logging: *logging

  web:
    build: { context: .., dockerfile: ops/Dockerfile.web }
    image: nomad-web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - certbot:/var/www/certbot
      - nginx-cache:/var/cache/nginx
    # Reload every 6 h so renewed certificates are picked up without a restart.
    command: ["/bin/sh", "-c", "while :; do sleep 6h; nginx -s reload; done & exec nginx -g 'daemon off;'"]
    depends_on:
      app: { condition: service_healthy }
    restart: unless-stopped
    logging: *logging

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nomad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: nomad
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nomad -d nomad"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging

  # Let's Encrypt renewal (opt-in: `--profile certbot up -d`); first issuance is described in README.
  # Renewed files are copied into ./certs, which nginx reads.
  certbot:
    image: certbot/certbot:v2.11.0
    profiles: ["certbot"]
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - certbot:/var/www/certbot
      - ./certs:/certs
    entrypoint:
      - /bin/sh
      - -c
      - >-
        trap exit TERM; while :; do
        certbot renew --webroot -w /var/www/certbot --quiet
        --deploy-hook 'cp -L /etc/letsencrypt/live/$$DOMAIN/fullchain.pem /etc/letsencrypt/live/$$DOMAIN/privkey.pem /certs/';
        sleep 12h & wait $${!}; done
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  redisdata:
  uploads:
  certbot:
  nginx-cache:
