stages:
  - check
  - test

default:
  image: node:22-alpine
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npx -y npm@11 ci --cache .npm --prefer-offline

lint:
  stage: check
  script: npm run lint

typecheck:
  stage: check
  script: npm run typecheck

unit:
  stage: check
  script: npm test

sast:
  stage: test

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
