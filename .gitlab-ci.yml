stages:
  - check
  - test

default:
  image: node:22-alpine
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npx -y npm@11 ci --cache .npm --prefer-offline

lint:
  stage: check
  script: npm run lint

typecheck:
  stage: check
  script: npm run typecheck

unit:
  stage: check
  script: npm test

e2e:
  stage: test
  when: manual
  allow_failure: true
  image: mcr.microsoft.com/playwright:v1.65.0-noble
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_USER: nomad
    POSTGRES_PASSWORD: nomad
    POSTGRES_DB: nomad_e2e
    E2E_DATABASE_URL: postgres://nomad:nomad@postgres:5432/nomad_e2e
  before_script:
    - npx -y npm@11 ci --cache .npm --prefer-offline
  script: npm run e2e
  artifacts:
    when: always
    expire_in: 1 week
    paths: [e2e/.report/, e2e/.results/]

sast:
  stage: test

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
